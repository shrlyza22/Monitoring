global:
  scrape_interval: 15s # Prometheus bakal narik data tiap 15 detik

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Monitoring diri sendiri dulu buat testing

  - job_name: 'mininet-exporter'
    static_configs:
      - targets: ['10.10.10.5:8000'] # Target exporter lu nanti (asumsi port 8000)